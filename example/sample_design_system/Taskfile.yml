version: '3'

tasks:
  run:
    desc: Launch the sample consumer application on the selected Flutter device.
    cmds:
      - flutter run {{.CLI_ARGS}}

  run_mac:
    desc: Launch the sample consumer application on macOS.
    platforms: [darwin]
    cmds:
      - flutter run -d macos {{.CLI_ARGS}}

  web:
    desc: Launch the sample consumer application in Chrome.
    cmds:
      - flutter run -d chrome {{.CLI_ARGS}}

  web:build:
    desc: Create a production web build of the sample consumer application.
    cmds:
      - flutter build web {{.CLI_ARGS}}

  analyze:
    desc: Analyze the sample consumer application.
    cmds:
      - flutter analyze

  test:
    desc: Run the sample consumer's tests.
    cmds:
      - flutter test

  format:
    desc: Format sample application source and tests.
    cmds:
      - dart format lib test

  simdeck:run:
    desc: Launch the sample in debug mode for SimDeck Flutter inspection.
    cmds:
      - flutter run {{.CLI_ARGS}}

  simdeck:describe:
    desc: Describe the running sample through the SimDeck Flutter inspector.
    cmds:
      - simdeck describe --source flutter --format agent --max-depth 4 --interactive
