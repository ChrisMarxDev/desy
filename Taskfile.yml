version: '3'

includes:
  bench:
    taskfile: ./packages/desy_bench/Taskfile.yml
    dir: ./packages/desy_bench
  ide:
    taskfile: ./packages/desy_ide/Taskfile.yml
    dir: ./packages/desy_ide
  overlay:
    taskfile: ./packages/desy_overlay/Taskfile.yml
    dir: ./packages/desy_overlay
  agent_annotations:
    taskfile: ./packages/extensions/desy_agent_annotations/Taskfile.yml
    dir: ./packages/extensions/desy_agent_annotations
  design_system:
    taskfile: ./packages/desy_design_system/Taskfile.yml
    dir: ./packages/desy_design_system
  dogfood:
    taskfile: ./packages/desy_design_system/example/Taskfile.yml
    dir: ./packages/desy_design_system/example
  widgetbook:
    taskfile: ./packages/desy_design_system/widgetbook/Taskfile.yml
    dir: ./packages/desy_design_system/widgetbook
  widget_previewer:
    taskfile: ./packages/desy_design_system/widget_previewer/Taskfile.yml
    dir: ./packages/desy_design_system/widget_previewer
  screenshot_builder:
    taskfile: ./packages/extensions/desy_screenshot_builder/Taskfile.yml
    dir: ./packages/extensions/desy_screenshot_builder
  genui:
    taskfile: ./packages/extensions/desy_genui/Taskfile.yml
    dir: ./packages/extensions/desy_genui
  genui_example:
    taskfile: ./packages/extensions/desy_genui/example/Taskfile.yml
    dir: ./packages/extensions/desy_genui/example
  widget_workshop:
    taskfile: ./packages/extensions/desy_widget_workshop/Taskfile.yml
    dir: ./packages/extensions/desy_widget_workshop

tasks:
  default:
    desc: List available workspace commands.
    cmds:
      - task --list

  pub:get:
    desc: Resolve dependencies for every package in the workspace.
    cmds:
      - flutter pub get

  analyze:
    desc: Analyze the complete workspace.
    deps: [pub:get]
    cmds:
      - flutter analyze

  test:
    desc: Run all package test suites.
    cmds:
      - task: bench:test
      - task: agent_annotations:test
      - task: design_system:test
      - task: dogfood:test
      - task: widgetbook:test
      - task: overlay:test
      - task: screenshot_builder:test
      - task: genui:test
      - task: genui_example:test
      - task: widget_workshop:test

  check:
    desc: Run the complete local verification suite.
    cmds:
      - task: analyze
      - task: design_system:forui-boundary
      - task: test
      - task: dogfood:build:web
      - task: widgetbook:build:web
      - task: overlay:build:example:web
      - task: genui_example:build:web

  format:
    desc: Format maintained Dart sources.
    cmds:
      - dart format packages

  simdeck:
    desc: Open SimDeck on port 4310 for debug Flutter inspection.
    cmds:
      - simdeck --open -p 4310

  simdeck:list:
    desc: List simulators and emulators available to SimDeck.
    cmds:
      - simdeck list

  simdeck:status:
    desc: Show SimDeck service status.
    cmds:
      - simdeck status

  simdeck:describe:flutter:
    desc: Describe the running dogfood app through Flutter widget inspection.
    cmds:
      - simdeck describe --source flutter --format agent --max-depth 4 --interactive
