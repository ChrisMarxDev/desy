version: '3'

tasks:
  run:
    desc: Run the GenUI sample explicitly in Chrome.
    cmds:
      - flutter run -d chrome --dart-define=GENUI_SERVER_URL=http://localhost:8787 2>&1 | tee -a flutter.log

  server:
    desc: Run the local OpenAI-backed GenUI server using .env.
    cmds:
      - dart run bin/openai_genui_server.dart

  run:codex:
    desc: Run the desktop app with its embedded local Codex experiment.
    cmds:
      - flutter run -d macos --dart-define=GENUI_DRIVER=codex 2>&1 | tee -a flutter.log

  run:bench:
    desc: Run Orbit's registered design system in Desy Bench.
    cmds:
      - flutter run -d macos --dart-define=ORBIT_MODE=bench 2>&1 | tee -a flutter.log

  log:
    desc: Read the most recent Flutter launch output.
    cmds:
      - tail -n 250 flutter.log

  analyze:
    desc: Analyze the GenUI sample and local server.
    cmds:
      - flutter analyze

  test:
    desc: Run the GenUI sample tests.
    cmds:
      - flutter test

  build:web:
    desc: Build the GenUI sample for web.
    cmds:
      - flutter build web

  format:
    desc: Format the sample source and tests.
    cmds:
      - dart format bin lib test
