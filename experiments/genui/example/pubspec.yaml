name: desy_genui_example
description: Flutter sample consuming a Desy-generated GenUI catalog.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.35.7'

resolution: workspace

dependencies:
  a2ui_core: ^0.1.0
  desy_core:
    path: ../../../packages/desy_core
  desy_bench:
    path: ../../../packages/desy_bench
  desy_genui:
    path: ../desy_genui
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  genui: ^0.10.1
  genui_codex:
    path: ../experiments/genui_codex
  codex_app_server:
    path: ../experiments/codex_app_server
  http: ^1.6.0
  mix: ^2.1.0
  flutter_markdown_plus: ^1.0.12
  flutter_mermaid: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundles the icon font required by flutter_mermaid's internal fallback
  # states. Orbit itself remains a WidgetsApp with Mix-owned controls.
  uses-material-design: true
