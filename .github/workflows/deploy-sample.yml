name: Deploy sample to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://desy-bench.web.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Build Harbor sample
        working-directory: example/sample_design_system
        run: >-
          flutter build web
          --no-wasm-dry-run
          --release
          --dart-define=DESY_BUILD_SHA=${{ github.sha }}
          --dart-define=DESY_BUILD_TIME=${{ github.event.repository.updated_at }}

      - name: Write deployment metadata
        run: |
          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{commit: $commit, deployedAt: $deployedAt, runUrl: $runUrl}' \
            > example/sample_design_system/build/web/build-metadata.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: desy-bench
          workload_identity_provider: projects/304128145969/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-hosting@desy-bench.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: >-
          npx --yes firebase-tools@15.4.0 deploy
          --only hosting
          --project desy-bench
          --non-interactive
