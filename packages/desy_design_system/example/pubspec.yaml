name: desy_design_system_example
description: The executable Desy catalogue for Desy's own design system.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.29.0'

resolution: workspace

dependencies:
  desy_bench:
    path: ../../desy_bench
  desy_design_system:
    path: ..
  desy_screenshot_builder:
    path: ../../extensions/desy_screenshot_builder
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
