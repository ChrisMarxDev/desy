version: '3'

tasks:
  analyze:
    desc: Analyze the reusable Desy Bench package.
    cmds:
      - flutter analyze

  test:
    desc: Run Desy Bench package tests.
    cmds:
      - flutter test

  format:
    desc: Format Desy Bench source and tests.
    cmds:
      - dart format lib test

  benchmark:snap:
    desc: Benchmark Sketch snapping on the Flutter VM.
    cmds:
      - flutter test test/benchmark/snap_engine_benchmark_test.dart --dart-define=DESY_SNAP_BENCHMARK=true --reporter expanded

  benchmark:snap:web:
    desc: Benchmark Sketch snapping in compiled Chrome.
    cmds:
      - flutter test --platform chrome test/benchmark/snap_engine_benchmark_test.dart --dart-define=DESY_SNAP_BENCHMARK=true --reporter expanded
