name: desy_bench
description: Flutter-native workbench contracts and catalogue for repository-owned design systems.
version: 0.1.0
repository: https://github.com/example/desy_bench
# This initial distribution is intentionally GitHub-first. A pub.dev release
# will replace the internal Git dependency with a hosted package dependency.
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.29.0'

resolution: workspace

dependencies:
  # Resolve Desy's private scaffold package from the same Git monorepo. This
  # keeps a Git-installed consumer dependency self-contained until pub.dev.
  desy_design_system:
    git:
      url: https://github.com/ChrisMarxDev/desy.git
      path: packages/desy_design_system
      ref: main
  desy_core:
    path: ../desy_core
  device_preview: ^1.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_box_transform: ^0.4.7
  go_router: ^17.3.0
  motor: ^1.1.0
  state_beacon: ^3.1.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
