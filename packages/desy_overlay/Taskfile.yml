version: '3'

tasks:
  analyze:
    desc: Analyze the reusable Desy overlay package and example.
    cmds:
      - flutter analyze

  test:
    desc: Run Desy overlay and example widget tests.
    cmds:
      - flutter test
      - task: example:test

  example:test:
    desc: Run the Desy overlay example widget test.
    dir: example
    cmds:
      - flutter test

  build:example:web:
    desc: Prove the opt-in overlay compiles in a release example.
    dir: example
    cmds:
      - flutter build web --release

  format:
    desc: Format Desy overlay source, tests, and example source.
    cmds:
      - dart format lib test example/lib example/test
