name: desy_screenshot_builder
description: Experimental screenshot-builder workspace extension for Desy Bench.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.29.0'

resolution: workspace

dependencies:
  desktop_drop: ^0.7.1
  desy_bench:
    path: ../../desy_bench
  desy_design_system:
    path: ../../desy_design_system
  file_saver: ^0.4.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  object_canvas:
    path: ../../object_canvas

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
