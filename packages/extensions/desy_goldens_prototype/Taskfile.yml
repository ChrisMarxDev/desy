version: '3'

tasks:
  run:
    desc: Open the interactive dogfood goldens prototype.
    cmds:
      - dart run bin/desy_goldens_prototype.dart

  plan:
    desc: Derive the complete dogfood golden plan without comparing images.
    cmds:
      - dart run bin/desy_goldens_prototype.dart plan

  verify:
    desc: Verify every derived dogfood golden without mutation.
    cmds:
      - dart run bin/desy_goldens_prototype.dart verify

  update:
    desc: Explicitly generate or update every derived dogfood baseline.
    cmds:
      - dart run bin/desy_goldens_prototype.dart update --accept

  analyze:
    desc: Analyze the isolated dogfood goldens prototype.
    cmds:
      - flutter analyze

  format:
    desc: Format the isolated dogfood goldens prototype.
    cmds:
      - dart format bin lib test
