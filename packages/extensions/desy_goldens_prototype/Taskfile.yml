version: '3'

tasks:
  plan:
    desc: Derive the complete dogfood golden plan without comparing images.
    cmds:
      - flutter test test/dogfood_goldens_test.dart --dart-define=DESY_GOLDEN_MODE=plan

  verify:
    desc: Verify every derived dogfood golden without mutation.
    cmds:
      - flutter test test/dogfood_goldens_test.dart --dart-define=DESY_GOLDEN_MODE=verify

  update:
    desc: Explicitly generate or update every derived dogfood baseline.
    cmds:
      - flutter test --update-goldens test/dogfood_goldens_test.dart --dart-define=DESY_GOLDEN_MODE=update

  analyze:
    desc: Analyze the isolated dogfood goldens prototype.
    cmds:
      - flutter analyze

  format:
    desc: Format the isolated dogfood goldens prototype.
    cmds:
      - dart format lib test
