version: '3'

tasks:
  run:
    desc: Run the Desy IDE macOS host and its live headless widget runtime.
    platforms: [darwin]
    cmds:
      - flutter run -d macos -t lib/main.dart --dart-define=DESY_IDE_PROJECT_DIR={{.TASKFILE_DIR}} {{.CLI_ARGS}}

  hot_reload:
    desc: Run the same-process hot-reload prototype with its Codex console.
    platforms: [darwin]
    cmds:
      - flutter run -d macos -t lib/hot_reload_ide_main.dart --pid-file=build/desy_ide_hot_reload.pid --dart-define=DESY_IDE_PROJECT_DIR={{.TASKFILE_DIR}} {{.CLI_ARGS}}

  runtime:
    desc: Run only the headless live-widget runtime for diagnostics.
    cmds:
      - flutter run --show-test-device -d flutter-tester -t lib/preview_runtime_main.dart {{.CLI_ARGS}}

  build:mac:
    desc: Build the prototype macOS host.
    platforms: [darwin]
    cmds:
      - flutter build macos --dart-define=DESY_IDE_PROJECT_DIR={{.TASKFILE_DIR}} {{.CLI_ARGS}}

  analyze:
    desc: Analyze the Desy IDE prototype.
    cmds:
      - flutter analyze

  format:
    desc: Format the Desy IDE prototype.
    cmds:
      - dart format lib
